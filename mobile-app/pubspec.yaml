name: baby_couveuse
description: Système de surveillance néonatale en couveuse - PFE

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Thème
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  fluttertoast: ^8.2.5

  # Stockage local sécurisé
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Sécurité
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

  # Communication réseau
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # Utilitaires
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Génération de code Hive (pour les adapters si besoin plus tard)
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  # Assets (si vous ajoutez des images plus tard)
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Fonts personnalisées (optionnel, google_fonts est déjà utilisé)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf